services:
  postgres:
    image: postgres:16
    container_name: postgres
    environment:
      POSTGRES_USER: clinic
      POSTGRES_PASSWORD: clinic123
      POSTGRES_DB: clinic
    volumes:
      - postgres_data:/var/lib/postgresql/data

  kafka:
    image: apache/kafka:3.7.0
    container_name: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: smart-clinic
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    depends_on:
      - kafka

  consumer:
    build: .
    container_name: consumer
    command: python backend/kafka_consumer.py
    depends_on:
      - kafka
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092


  backend:
    build: .
    container_name: backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://clinic:clinic123@postgres:5432/clinic
    depends_on:
      - postgres

  frontend:
    image: nginx:alpine
    container_name: frontend
    ports:
      - "5500:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
    depends_on:
      - backend

  patient-generator:
    build: .
    container_name: patient-generator
    command: python -u scripts/patient_generator.py
    environment:
      BASE_URL: http://backend:8000
    depends_on:
      - backend

  doctor-simulator:
    build: .
    container_name: doctor-simulator
    command: python -u scripts/doctor_simulator.py
    environment:
      BASE_URL: http://backend:8000
    depends_on:
      - backend

volumes:
  postgres_data:

  